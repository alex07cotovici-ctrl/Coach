<style>

table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

async function pushDb(){
  if(!dbRef) return;
  if(writing){ pending = true; return; }
  writing = true;
  try{ await dbRef.set({s: JSON.parse(JSON.stringify(S))}); setSync("Synced to your account"); }
  catch(e){ setSync(e && e.code==="quota_exceeded" ? "Sync storage full: export a backup in Progress" : "Saved on this phone, sync paused"); }
  writing = false;
  if(pending){ pending = false; pushDb(); }
}

/* ---------------- HELPERS ---------------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const totals = (k=today()) => day(k).food.reduce((a,f)=>({k:a.k+f.k, p:a.p+f.p}), {k:0,p:0});
function chips(group, opts, cur){
  return '<div class="chips">'+Object.entries(opts).map(([v,l]) =>
    `<button type="button" class="chip ${cur===v?"on":""}" data-act="pick" data-g="${group}" data-v="${v}">${esc(l)}</button>`).join("")+'</div>';
}
function weekKeys(){
  const d = new Date(); const dow = (d.getDay()+6)%7; const out=[];
  for(let i=0;i<7;i++){ const x = new Date(d); x.setDate(d.getDate()-dow+i); out.push(dkey(x)); }
  return out;
}
function workoutsThisWeek(){ return weekKeys().filter(k => S.days[k] && S.days[k].wk && S.days[k].wk.done && S.days[k].wk.type!=="REST").length; }
function checkinStreak(){
  let n=0; const d=new Date();
  if(!(S.days[today()] && (S.days[today()].am.done||S.days[today()].pm.done))) d.setDate(d.getDate()-1);
  for(;;){ const k=dkey(d); const x=S.days[k]; if(x && (x.am.done||x.pm.done)){ n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}
function resistedWeek(){ const wk = weekKeys(); return S.temptations.filter(t => wk.includes(t.d) && t.o!=="gave").length; }
function sortedW(){ return [...S.weights].sort((a,b)=>a.d.localeCompare(b.d)); }
function avgBetween(fromDaysAgo, toDaysAgo){
  const now = new Date(today()).getTime();
  const xs = S.weights.filter(w => { const a = (now - new Date(w.d).getTime())/864e5; return a>=toDaysAgo && a<fromDaysAgo; });
  if(xs.length<2) return null;
  return xs.reduce((s,w)=>s+w.kg,0)/xs.length;
}
function trend(){
  const a = avgBetween(7,0), b = avgBetween(14,7);
  if(a==null || b==null) return null;
  return {last:a, prev:b, rate:b-a};
}
const tipOfDay = () => { const d=new Date(); const doy=Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); return TIPS[doy % TIPS.length]; };

function eveningFeedback(d){
  const pm=d.pm, good=[], fix=[];
  if(d.wk.done) good.push("trained");
  if(pm.walk==="yes") good.push("walked"); else if(pm.walk==="no") fix.push("Get a 20-minute walk in tomorrow, even split into two.");

  if(pm.water==="hi") good.push("drank enough water"); else if(pm.water==="lo") fix.push("Keep a bottle with you tomorrow: 2.5 L.");
  if(pm.prot==="yes") good.push("ate protein"); else fix.push("Add a protein to every meal tomorrow: eggs, yogurt, chicken, cottage cheese.");
  if(+pm.rate<=2) fix.push("Rough eating day. Don't compensate by starving tomorrow: just eat normally from breakfast.");
  let s = good.length ? "Today you "+good.join(", ")+". " : "Thanks for checking in. ";
  s += fix.length ? fix[0] : "Solid day. Repeat it tomorrow.";
  return s;
}

function viewProgress(){
  const st = S.settings; const ws = sortedW(); const last = ws.length? ws[ws.length-1].kg : st.start;
  let h = header("Progress", "Weight and settings");
  const lost = (st.start - last), toGo = last - st.goal;
  h += `<section class="card"><div class="stats">
    <div class="stat"><span class="num">${last.toFixed(1)}</span><small>kg now</small></div>
    <div class="stat"><span class="num ${lost>0?"ok":""}">${lost>0?"−":""}${Math.abs(lost).toFixed(1)}</span><small>kg since start</small></div>
    <div class="stat"><span class="num">${Math.max(0,toGo).toFixed(1)}</span><small>kg to ${st.goal} kg</small></div></div>
    ${chart(ws)}
    <div class="q"><label for="w-in">Log weight (morning, before eating)</label><div class="inline"><input id="w-in" type="number" inputmode="decimal" step="0.1" placeholder="kg"><button class="btn primary" type="button" data-act="wadd">Save</button></div></div></section>`;

  const tr = trend();
  let adv;
  if(!tr) adv = `<p class="small muted">Weigh in 3–4 mornings a week. After 2 weeks you'll get advice here on whether to change your calories.</p>`;
  else{
    const r = tr.rate;
    let msg, cls;
    if(r < 0.3){ msg = "Losing less than 0.3 kg a week. Cut 150–200 kcal (set calories to "+(st.kcal-200)+") or add 2,000 steps a day. Check this for 2 weeks in a row before changing."; cls="warn"; }
    else if(r <= 1){ msg = "On track. Keep everything the same."; cls="ok"; }
    else { msg = "Losing over 1 kg a week. Eat 150–200 kcal more to protect your muscle."; cls="warn"; }
    adv = `<p class="small">Last 7 days average <b class="num">${tr.last.toFixed(1)} kg</b>, the week before <b class="num">${tr.prev.toFixed(1)} kg</b>, so <b>${r>=0?"−":"+"}${Math.abs(r).toFixed(2)} kg/week</b>.</p><p class="${cls}">${msg}</p>`;
  }
  h += `<section class="card"><h3>Should you adjust?</h3>${adv}<p class="small muted">Don't go below about 1,900 kcal a day without a doctor or dietitian. Every 10–12 weeks, eat at maintenance (about 2,700) for one week to reset.</p></section>`;

  h += `<section class="card"><h3>Settings</h3>
    <div class="q"><label for="s-why">My reason for doing this</label><textarea id="s-why" placeholder="e.g. I want to feel good without a shirt and have more energy for long days at uni.">${esc(st.why)}</textarea></div>
    <div class="row"><div class="q" style="flex:1"><label for="s-kcal">Calories / day</label><input id="s-kcal" type="number" inputmode="numeric" value="${st.kcal}"></div>
    <div class="q" style="flex:1"><label for="s-prot">Protein g / day</label><input id="s-prot" type="number" inputmode="numeric" value="${st.protein}"></div></div>
    <div class="row"><div class="q" style="flex:1"><label for="s-start">Start weight</label><input id="s-start" type="number" inputmode="decimal" step="0.1" value="${st.start}"></div>
    <div class="q" style="flex:1"><label for="s-goal">Goal weight</label><input id="s-goal" type="number" inputmode="decimal" step="0.1" value="${st.goal}"></div></div>
    <button class="btn primary" type="button" data-act="settings">Save settings</button></section>`;

  h += `<section class="card"><details><summary>Install on your iPhone</summary><ol class="clean small">
    <li>Open alex07cotovici-ctrl.github.io/coach in Safari.</li><li>Tap the Share button, then "Add to Home Screen".</li><li>Open it from the new icon like a normal app.</li></ol>
    <p class="small muted">Your data is saved on this phone. Always open the app from the Home Screen icon so iPhone keeps it, and copy a backup now and then.</p></details>
    <details><summary>Backup</summary><div class="list"><button class="btn" type="button" data-act="export">Copy backup to clipboard</button>
    <textarea id="imp" placeholder="Paste a backup here to restore it"></textarea><button class="btn" type="button" data-act="import">Restore from pasted backup</button><p class="small" id="bk-msg"></p></div></details></section>`;
  h += `<p class="small muted">Back care: technique before weight, keep your back neutral, stop on pain (not normal muscle tiredness). Have a physio or doctor check the squat, Romanian deadlift and ab exercises.</p>`;
  return h;
}
function chart(ws){
  if(ws.length<2) return `<p class="small muted">Your chart appears after your second weigh-in.</p>`;
  const W=340,H=150,P={l:34,r:12,t:12,b:22};
  const xs = ws.map(w=>new Date(w.d).getTime()); const ys = ws.map(w=>w.kg);
  let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0) x1=x0+864e5;
  let y0=Math.floor(Math.min(...ys, S.settings.goal)-0.5), y1=Math.ceil(Math.max(...ys)+0.5);
  const X=t=>P.l+(t-x0)/(x1-x0)*(W-P.l-P.r), Y=v=>P.t+(y1-v)/(y1-y0)*(H-P.t-P.b);
  const pts = ws.map((w,i)=>[X(xs[i]),Y(w.kg)]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = line+` L${pts[pts.length-1][0].toFixed(1)} ${H-P.b} L${pts[0][0].toFixed(1)} ${H-P.b} Z`;
  const ticks=[y0, Math.round((y0+y1)/2), y1];
  const gy = Y(S.settings.goal);
  const lp = pts[pts.length-1];
  const fmt = t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
    ${ticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("")}
    <line x1="${P.l}" x2="${W-P.r}" y1="${gy}" y2="${gy}" stroke="var(--good)" stroke-dasharray="4 4"/><text x="${W-P.r}" y="${gy-4}" text-anchor="end" font-size="11" fill="var(--good)">goal ${S.settings.goal}</text>
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="var(--accent)"/>
    <text x="${P.l}" y="${H-6}" font-size="11" fill="var(--muted)">${fmt(x0)}</text><text x="${W-P.r}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(x1)}</text></svg>`;
}

/* ---------------- RENDER + EVENTS ---------------- */
const app = document.getElementById("app");
function render(){
  const v = {today:viewToday, workout:viewWorkout, sos:viewSos, food:viewFood, progress:viewProgress}[tab]();
  app.innerHTML = v;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
}
function go(t){ tab=t; if(t!=="workout") wkSel=null; render(); window.scrollTo(0,0); try{ history.replaceState(null,"","#"+t);}catch(e){} }

let restT=null, restEnd=0;
function startRest(sec){
  restEnd = Date.now()+sec*1000; document.getElementById("restbar").classList.add("show"); clearInterval(restT);
  const tick=()=>{ const l=Math.max(0,Math.ceil((restEnd-Date.now())/1000)); document.getElementById("restleft").textContent=l; if(!l){ stopRest(); try{navigator.vibrate&&navigator.vibrate(200);}catch(e){} } };
  tick(); restT=setInterval(tick,500);
}
function stopRest(){ clearInterval(restT); document.getElementById("restbar").classList.remove("show"); }

let sosT=null;
function sosTick(){ const el=document.getElementById("sostimer"); if(!el) return; const l=Math.max(0,Math.ceil((sos.until-Date.now())/1000)); el.textContent=pad(Math.floor(l/60))+":"+pad(l%60); }

function addFood(n,k,p){ day().food.push({n,k:Math.round(k),p:Math.round(p)}); save(); }
function addWeight(kg, d=today()){
  if(!(kg>30 && kg<300)) return false;
  S.weights = S.weights.filter(w=>w.d!==d); S.weights.push({d,kg:Math.round(kg*10)/10}); save(); return true;
}

document.addEventListener("click", async (ev)=>{
  const tb = ev.target.closest(".tab"); if(tb){ go(tb.dataset.tab); return; }
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if(a==="go"){ go(v); }
  else if(a==="pick"){
    const [scope,key] = b.dataset.g.split(".");
    if(scope==="sos"){ sos[key] = sos[key]===v?null:v; }
    else { const d=day(); d[scope][key] = v; save(); }
    const y = window.scrollY; render(); window.scrollTo(0,y);
  }
  else if(a==="am-save"){ const d=day(); const w=parseFloat((document.getElementById("am-weight")||{}).value); if(w) addWeight(w); d.am.done=true; save(); render(); }
  else if(a==="pm-save"){ const d=day(); d.pm.done=true; save(); render(); }
  else if(a==="openwk"){ wkSel=v; tab="workout"; render(); window.scrollTo(0,0); }
  else if(a==="wksel"){ wkSel=v; render(); }
  else if(a==="set"){
    const [type,i,j]=v.split("|"); const d=day();
    if(d.wk.type!==type) d.wk={type, sets:{}, done:false};
    const k=i+"-"+j; d.wk.sets[k]=!d.wk.sets[k]; save();
    const y=window.scrollY; render(); window.scrollTo(0,y);
    if(d.wk.sets[k]) startRest(type==="QUICK"?20:75);
  }
  else if(a==="rest-stop"){ stopRest(); }
  else if(a==="wkdone"){ const d=day(); if(d.wk.type!==v) d.wk={type:v,sets:{}}; d.wk.done=true; save(); stopRest(); render(); }
  else if(a==="sos-go"){ sos.step=1; sos.until=Date.now()+600000; coachText=""; render(); window.scrollTo(0,0); clearInterval(sosT); sosT=setInterval(sosTick,1000); }
  else if(a==="sos-out"){
    const n=new Date(); S.temptations.push({d:today(), h:pad(n.getHours())+":"+pad(n.getMinutes()), c:sos.c, t:sos.t, o:v}); save();
    clearInterval(sosT); const msg={resisted:"Craving beaten. That one counts.", swap:"Good swap. That's exactly how it's done.", planned:"Planned portion, logged. That's a normal life, not a failure.", gave:"Logged. One moment doesn't decide anything. Next meal back to normal, no skipping."}[v];
    sos={step:0}; coachText=""; render(); toast(msg);
  }
  else if(a==="addswap"){ const s=CRAVINGS[sos.c].swaps[+v]; addFood(s[0],s[1],s[2]); toast("Logged: "+s[0]); }
  else if(a==="coach"){ askCoach(); }
  else if(a==="fadd"){ const f=FOODS[+v]; addFood(f[0],f[1],f[2]); const y=window.scrollY; render(); window.scrollTo(0,y); toast("Added: "+f[0]); }
  else if(a==="madd"){ const [c,i]=v.split("|"); const m=MEALS[c][+i]; addFood(m[0],m[1],m[2]); const y=window.scrollY; render(); window.scrollTo(0,y); toast("Logged "+c.toLowerCase()); }
  else if(a==="fdel"){ day().food.splice(+v,1); save(); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="fcustom"){
    const n=document.getElementById("cf-n").value.trim()||"Other", k=+document.getElementById("cf-k").value||0, p=+document.getElementById("cf-p").value||0;
    if(k<=0){ toast("Enter the calories"); return; } addFood(n,k,p); render();
  }
  else if(a==="wadd"){ const w=parseFloat(document.getElementById("w-in").value); if(addWeight(w)){ render(); toast("Weight saved"); } else toast("Enter a weight in kg"); }
  else if(a==="settings"){
    const st=S.settings; st.why=document.getElementById("s-why").value.trim();
    const k=+document.getElementById("s-kcal").value, p=+document.getElementById("s-prot").value, s0=+document.getElementById("s-start").value, g=+document.getElementById("s-goal").value;
    if(k>=1200&&k<=4000) st.kcal=Math.round(k); if(p>=50&&p<=300) st.protein=Math.round(p); if(s0>30) st.start=s0; if(g>30) st.goal=g;
    save(); render(); toast("Settings saved");
  }
  else if(a==="export"){ try{ await navigator.clipboard.writeText(JSON.stringify(S)); document.getElementById("bk-msg").textContent="Backup copied. Paste it into Notes to keep it."; }catch(e){ document.getElementById("imp").value=JSON.stringify(S); document.getElementById("bk-msg").textContent="Couldn't copy automatically: the backup is in the box above, select and copy it."; } }
  else if(a==="import"){ try{ const x=JSON.parse(document.getElementById("imp").value); if(!x||!x.settings||!x.days) throw 0; S=Object.assign(DEF(),x); save(); render(); toast("Backup restored"); }catch(e){ document.getElementById("bk-msg").textContent="That doesn't look like a Cut Coach backup."; } }
});

function toast(m){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4)"; document.body.appendChild(t); }
  t.textContent=m; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2600);
}

async function askCoach(){
  if(!sampleFn || coachBusy) return;
  coachBusy=true; coachText=""; render();
  const C=CRAVINGS[sos.c], T=TRIGGERS[sos.t], t=totals(), n=new Date();
  const prompt = `You are a supportive, direct fat-loss coach texting Alex, a 19-year-old medical student (180 cm, ${sortedW().slice(-1)[0].kg} kg, goal ${S.settings.goal} kg, eating about ${S.settings.kcal} kcal and ${S.settings.protein} g protein a day, training at home 4 days a week).
Right now (${pad(n.getHours())}:${pad(n.getMinutes())}) he is tempted by: ${C.label}. Reason: ${T.label}. He has eaten ${t.k} kcal and ${t.p} g protein so far today. His own reason for losing fat: "${S.settings.why||"not set"}".
Write a reply under 80 words: acknowledge the craving in one line, then 2–3 concrete actions for the next 10 minutes, and one smart option if he still wants to eat. Plain text, no lists with symbols, no shaming. Never suggest skipping meals, fasting, compensating, or eating under 1,800 kcal.`;
  try{
    const r = await sampleFn(prompt,{modelTier:"quick", cache:false, onText:({text})=>{ coachText=text; const el=document.querySelector(".coach"); if(el) el.textContent=text; else { const y=window.scrollY; render(); window.scrollTo(0,y);} }});
    coachText = r.text;
  }catch(e){ coachText = e && e.code==="not_granted" ? "" : "Couldn't reach the coach right now. Use the steps above."; if(e&&e.code==="not_granted") sampleFn=null; }
  coachBusy=false; const y=window.scrollY; render(); window.scrollTo(0,y);
}

/* ---------------- BOOT ---------------- */
if(!IN_CLAUDE && "serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
const h0 = (location.hash||"").slice(1); if(["today","workout","sos","food","progress"].includes(h0)) tab=h0;
render();

(async ()=>{
  try{
    if(!IN_CLAUDE){ setSync("Saved on this phone"); return; }
    for(let i=0; i<30 && !(window.claude && typeof window.claude.use==="function"); i++) await new Promise(r=>setTimeout(r,100));
    if(!(window.claude && typeof window.claude.use==="function")) { setSync("Saved on this phone"); return; }
    const [db, user, sample] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
    if(sample){ sampleFn = sample; if(tab==="sos") render(); }
    if(!db || !user) { setSync("Saved on this phone"); return; }
    const id = await user.id(); if(!id){ setSync("Saved on this phone"); return; }
    const ref = db.doc("data/users/"+id+"/state");
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
    dbRef = ref;
    if(snap.exists){
      const remote = (snap.data()||{}).s;
      if(remote && (remote.updatedAt||0) > (S.updatedAt||0)){
        S = Object.assign(DEF(), JSON.parse(JSON.stringify(remote))); S.settings=Object.assign(DEF().settings,S.settings||{});
        try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
        const y=window.scrollY; render(); window.scrollTo(0,y);
      } else if((S.updatedAt||0) > (remote&&remote.updatedAt||0)) { pushDb(); }
    } else if(S.updatedAt) { pushDb(); }
    setSync("Synced to your account");
  }catch(e){ setSync("Saved on this phone"); }
})();
</script>
